services:
  api:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://:freshcart_redis_pass_2026@redis:6379
    depends_on:
      - redis
    restart: always

  redis:
    image: redis:alpine
    command: redis-server --requirepass freshcart_redis_pass_2026
    restart: always
